\"$\",\"h4\",null,{\"className\":\"bpif-products-company_title__8sHKe\",\"children\":\"ЕСЛИ БРОКЕРСКОГО СЧЕТА НЕТ\"}],[\"$\",\"div\",null,{\"className\":\"bpif-products-company_content__jwGvs\",\"children\":[[\"$\",\"div\",\"0\",{\"className\":\"bpif-products-company_product__ZgLCW\",\"children\":[[\"$\",\"div\",null,{\"className\":\"bpif-products-company_productContainer__BXj6E\",\"children\":[\"$\",\"div\",null,{\"className\":\"bpif-products-company_productContainerLeft__1H6jB\",\"children\":[[\"$\",\"h4\",null,{\"className\":\"bpif-products-company_productTitle__vZTlP\",\"children\":\"ДУ\"}],[\"$\",\"div\",null,{\"className\":\"bpif-products-company_productDescription__Lg7_5\",\"children\":\"Станьте инвестором любого фонда через Доверительное управление. Открывать брокерский счет для этого не нужно\"}],[\"$\",\"$L16\",null,{\"color\":\"secondary\",\"as\":\"a\",\"target\":\"_blank\",\"href\":\"/trust-management\",\"size\":\"m\",\"children\":\"Подробнее\"}]]}]}],[\"$\",\"$L15\",null,{\"className\":\"bpif-products-company_productImg__WC5lr\",\"src\":\"/_next/static/media/bpif-products-company-du.0fb898c4.webp\",\"width\":135,\"height\":206.47,\"alt\":\"ДУ\"}]]}]]}]]}]}]}],[\"$\",\"div\",null,{\"className\":\"block-faq\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-container\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-wrapper\",\"children\":[\"$\",\"$L19\",null,{\"items\":[{\"id\":1,\"question\":\"Что такое биржевой фонд?\",\"answer\":[\"$\",\"div\",null,{\"children\":[\"Биржевой паевой инвестиционный фонд или БПИФ — это классический паевой инвестиционный фонд с одним отличием — паи такого фонда можно купить и продать с помощью вашего брокера на бирже. Причем специальное уполномоченное лицо (брокер, выбранный управляющей компанией) обязано продавать вам или выкупать у вас паи по вашим заявкам.\",[\"$\",\"br\",null,{}],[\"$\",\"br\",null,{}],\"Паи фонда свободно торгуются на бирже. Цена пая определяется в ходе торгов. Покупка и продажа происходят по рыночным ценам на фондовом рынке.\"]}]},{\"id\":2,\"question\":\"В чем преимущества БПИФ?\",\"answer\":[\"$\",\"div\",null,{\"children\":[\"$\",\"ul\",null,{\"children\":[[\"$\",\"li\",null,{\"children\":\"Хорошая диверсификация — приобретая паи биржевого фонда, вы инвестируете сразу в большое количество компаний из разных отраслей экономики.\"}],[\"$\",\"li\",null,{\"children\":\"Низкий порог входа — начать инвестировать в биржевые фонды УК Ингосстрах-Инвестиции» можно примерно со 100 ₽.\"}],[\"$\",\"li\",null,{\"children\":\"Высокая ликвидность — купить и продать паи фонда можно в любой рабочий день на бирже.\"}],[\"$\",\"li\",null,{\"children\":\"Низкие комиссии за обслуживание фонда — вознаграждение и расходы управляющей компании по БПИФ обычно меньше, чем по открытым паевым фондам. УК «Ингосстрах–Инвестиции» за обслуживание своего биржевого фонда «Ингосстрах Инфляционный» взимает от 0,15% среднегодовой стоимости чистых активов фонда — это одна из самых низких комиссий на рынке (помимо комиссии УК за счет имущества, составляющего фонд, также выплачиваются вознаграждения специализированному депозитарию, регистратору, бирже и иные расходы в общей сумме до 0,25%).\"}],[\"$\",\"li\",null,{\"children\":\"Биржевой паевой инвестиционный фонд или БПИФ — это классический паевой инвестиционный фонд с одним отличием — паи такого фонда можно купить и продать с помощью вашего брокера на бирже. Причем специальное уполномоченное лицо (брокер, выбранный управляющей компанией) обязано продавать вам или выкупать у вас паи по вашим заявкам.\"}],[\"$\",\"li\",null,{\"children\":\"Простота и удобство — для покупки и продажи паев достаточно открыть брокерский счет и подать онлайн-поручение брокеру.\"}],[\"$\",\"li\",null,{\"children\":\"Прозрачность — структура БПИФ соответствует выбранному управляющей компанией индексу.\"}]]}]}]},{\"id\":3,\"question\":\"Какие комиссии взимаются при покупке паев БПИФ?\",\"answer\":[\"$\",\"div\",null,{\"children\":[\"$\",\"ul\",null,{\"children\":[[\"$\",\"li\",null,{\"children\":\"Для совершения сделок на бирже требуется брокер и открытый брокерский счет. Брокерская компания берет комиссию, и ее размер зависит от выбранного вами тарифа на брокерское обслуживание.\"}],[\"$\",\"li\",null,{\"children\":\"В брокерскую комиссию часто включены плата за услуги депозитария и биржи и плата за пользование платежным терминалом. Также могут взиматься проценты со сделок, совершенных с помощью услуг брокера.\"}]]}]}]},{\"id\":4,\"question\":\"Могут ли госслужащие инвестировать в БПИФ?\",\"answer\":\"Госслужащие, в том числе военнослужащие, могут инвестировать в российские ценные бумаги и облигации федерального займа лишь в том случае, если у них не возникает конфликт интересов. Поэтому таким инвесторам стоит предварительно ознакомиться с инвестиционными декларациями БПИФ, чтобы убедиться в отсутствии ценных бумаг иностранных компаний в составе портфеля БПИФ.\"},{\"id\":5,\"question\":\"В чем отличие биржевого фонда (БПИФ) от открытого паевого фонда (ОПИФ)?\",\"answer\":[\"$\",\"div\",null,{\"children\":[\"$\",\"ul\",null,{\"children\":[[\"$\",\"li\",null,{\"children\":\"Паи БПИФ можно купить и продать на бирже через своего брокера в любые рабочие часы биржи.\"}],[\"$\",\"li\",null,{\"children\":\"По сделкам с паями БПИФ нет надбавки (комиссии при покупке) и скидки (комиссии при продаже), которые управляющая компания взимает при сделках с паями открытых паевых фондов.\"}],[\"$\",\"li\",null,{\"children\":\"Управляющая компания стремится привести структуру БПИФ в соответствие индексу, который ежедневно раскрывается биржей и доступен онлайн.\"}],[\"$\",\"li\",null,{\"children\":\"Паи БПИФ обменивать нельзя. Перевести паи в другой фонд управляющей компании можно только через продажу паев. С паями же ОПИФ возможен обмен паев одного фонда на паи другого без комиссий и без прерывания периода владения, что дает инвестору возможность получить налоговый вычет при продаже паев после 3 лет владения ими.\"}]]}]}]}]}]}]}]}],[\"$\",\"div\",null,{\"className\":\"common-container\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-wrapper\",\"children\":[\"$\",\"div\",null,{\"id\":\"get-consultation-form\",\"className\":\"block-get-consultation-form\",\"children\":[\"$\",\"div\",null,{\"className\":\"block-get-consultation-form__form-container\",\"children\":[\"$\",\"$L1a\",null,{\"sourceField\":\"site_feedback_bpif\",\"typeField\":\"\",\"title\":\"ДО СТАРТА В ИНВЕСТИЦИЯХ ОСТАЛСЯ ВСЕГО ОДИН ШАГ\",\"subtitle\":\"Оставьте заявку на консультацию\",\"includeSurname\":\"$undefined\"}]}]}]}]}]]}]\n"])</script>
