"}],\"title\":\"ИНВЕСТИРОВАТЬ ОНЛАЙН\",\"note\":\"\u003csup\u003e1\u003c/sup\u003eДинамическая доходность рассчитана на 02.11.2026 за последние 5 лет (подробнее в \u003ca href='#footer-info' class='link'\u003e«Правовая информация»\u003c/a\u003e)\",\"fundType\":\"pif\",\"withMainCard\":true,\"mainCardTarget\":\"_self\"}],[\"$\",\"div\",null,{\"className\":\"block-steps page-pif_stepsBlock__NBkGZ\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-container\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-wrapper\",\"children\":[[\"$\",\"h2\",null,{\"className\":\"block-steps__title\",\"children\":\"Как начать инвестировать\"}],[\"$\",\"div\",null,{\"className\":\"block-steps__list\",\"children\":[[\"$\",\"div\",\"0\",{\"className\":\"block-steps__step-item\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"block-steps__step-item-number\",\"children\":\"01\"}],[\"$\",\"h4\",null,{\"className\":\"block-steps__step-item-title\",\"children\":\"Зарегистрироваться\"}],[\"$\",\"p\",null,{\"className\":\"block-steps__step-item-description\",\"children\":\"Заполните данные для покупки инвестиционных паев со своим менеджером\"}]]}],[\"$\",\"div\",\"1\",{\"className\":\"block-steps__step-item\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"block-steps__step-item-number\",\"children\":\"02\"}],[\"$\",\"h4\",null,{\"className\":\"block-steps__step-item-title\",\"children\":\"Купить инвестиционные паи\"}],[\"$\",\"p\",null,{\"className\":\"block-steps__step-item-description\",\"children\":\"Оплатите паи выбранного фонда удобным для вас способом\"}]]}],[\"$\",\"div\",\"2\",{\"className\":\"block-steps__step-item\",\"children\":[[\"$\",\"h3\",null,{\"className\":\"block-steps__step-item-number\",\"children\":\"03\"}],[\"$\",\"h4\",null,{\"className\":\"block-steps__step-item-title\",\"children\":\"Наблюдать за доходностью\"}],[\"$\",\"p\",null,{\"className\":\"block-steps__step-item-description\",\"children\":\"Получите доход от роста паев и погасите их в любой рабочий день\"}]]}]]}],[\"$\",\"$L18\",null,{\"className\":\"block-steps__link\",\"as\":\"a\",\"title\":\"Консультация\",\"href\":\"#get-consultation-form\"}]]}]}]}],[\"$\",\"div\",null,{\"className\":\"block-faq\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-container\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-wrapper\",\"children\":[\"$\",\"$L19\",null,{\"items\":[{\"id\":1,\"question\":\"Что такое ПИФ?\",\"answer\":[\"Паевой инвестиционный фонд (ПИФ) — это способ инвестирования, при котором инвестор передает имущество в доверительное управление управляющей компании.\",[\"$\",\"br\",null,{}],\"Переданное имущество сразу многих инвесторов объединяется в единый имущественный комплекс, и затем управляющая компания совершает с ним сделки по инвестированию, то есть покупает и продает активы.\",[\"$\",\"br\",null,{}],\"Цель управляющей компании — получить доход для инвесторов.\",[\"$\",\"br\",null,{}],\"УК управляет фондом на условиях доверительного управления, формируя портфель фонда в интересах инвесторов. Условия этого управления зафиксированы в правилах доверительного управления фондом.\"]},{\"id\":2,\"question\":\"Что такое пай?\",\"answer\":[\"Инвестиционный пай — это принадлежащая инвестору именная ценная бумага, которая удостоверяет его долю в праве собственности на часть имущества, которое находится в фонде.\",[\"$\",\"br\",null,{}],\"Пай дает возможность требовать соблюдения всех условий доверительного управления фондом.\",[\"$\",\"br\",null,{}],\"Хотя пай называется бумагой, по факту он существует только в электронном виде.\"]},{\"id\":3,\"question\":\"Как считается стоимость пая?\",\"answer\":[\"Цена 1 пая = СЧА / количество паев, находящихся в обращении.\",[\"$\",\"br\",null,{}],\"СЧА — это стоимость чистых активов, не обремененных какими-либо задолженностями и обязательствами фонда. То есть это разница между стоимостью всех активов внутри фонда и всеми предстоящими платежами за услуги, предоставляемые фонду (платой управляющему, регистратору и т.д.)\"]},{\"id\":4,\"question\":\"Как рассчитывается доход инвестора?\",\"answer\":[\"Доход инвестора будет равен разнице между суммой, на которую он купил паи, и суммой, за которую он их продаст или погасит.\",[\"$\",\"br\",null,{}],\"Можно продать паи новому пайщику или погасить, обратившись в управляющую компанию или к агенту по выдаче. Чем больше выросла стоимость чистых активов внутри фонда и стоимость паев за то время, пока инвестор был его пайщиком, тем больше составит его доход. При обращении к агенту по выдаче, погашению и обмену паев взимаются надбавки и скидки к расчетной стоимости инвестиционных паев, что уменьшает доходность инвестиций в них. Надбавки и скидки предусмотрены во всех ОПИФ (кроме ОПИФ рыночных финансовых инструментов «Мой сейф»).\"]},{\"id\":5,\"question\":\"Как узнать структуру активов, входящих в ПИФ?\",\"answer\":[\"В правилах доверительного управления каждого фонда в разделе «Инвестиционная декларация» вы можете увидеть, какие активы в этот ПИФ в целом может приобретать управляющая компания.\",[\"$\",\"br\",null,{}],\"В публикуемой ежемесячно справке о стоимости чистых активов можно узнать, какие конкретно активы входят в состав фонда на отчетную дату. Вся необходимая информация раскрывается в обязательном порядке на сайте управляющей компании в разделе \",[\"$\",\"a\",null,{\"href\":\"/open-info/required\",\"className\":\"link\",\"children\":\"«Раскрытие информации»\"}],\".\"]},{\"id\":6,\"question\":\"Какие документы потребуются для покупки паев?\",\"answer\":[\"$\",\"div\",null,{\"children\":[\"Для покупки паев ПИФа вам потребуются следующие документы:\",[\"$\",\"ul\",null,{\"children\":[[\"$\",\"li\",null,{\"children\":\"паспорт,\"}],[\"$\",\"li\",null,{\"children\":\"адрес регистрации (отметка в паспорте о регистрации или отдельное свидетельство о регистрации),\"}],[\"$\",\"li\",null,{\"children\":\"ИНН (свидетельство о постановке на учет в налоговом органе).\"}]]}],[\"$\",\"br\",null,{}],\"Купить паи ПИФа можно онлайн:\",[\"$\",\"br\",null,{}],[\"$\",\"ul\",null,{\"children\":[\"$\",\"li\",null,{\"children\":\"на сайте АО УК «Ингосстрах-Инвестиции» в Личном кабинете после регистрации,\"}]}],[\"$\",\"br\",null,{}],\"Кстати, подтвержденная учетная записи на портале «Госуслуги» значительно упростит процесс регистрации в Личном кабинете.\",[\"$\",\"br\",null,{}],\"Также вы можете обратиться к агентам управляющей компании (актуальный перечень агентов публикуется на сайте управляющей компании) или непосредственно в офис АО УК «Ингосстрах – Инвестиции» по адресу г. Москва ул. Пятницкая, д. 12, стр.2, предварительно договорившись о встрече по тел. +7 (495) 720-48-98.\"]}]}]}]}]}]}],[\"$\",\"div\",null,{\"className\":\"common-container\",\"children\":[\"$\",\"div\",null,{\"className\":\"common-wrapper\",\"children\":[\"$\",\"div\",null,{\"id\":\"get-consultation-form\",\"className\":\"block-get-consultation-form\",\"children\":[\"$\",\"div\",null,{\"className\":\"block-get-consultation-form__form-container\",\"children\":[\"$\",\"$L1a\",null,{\"sourceField\":\"site_feedback_pif\",\"typeField\":\"\",\"title\":\"ДО СТАРТА В ИНВЕСТИЦИЯХ ОСТАЛСЯ ВСЕГО ОДИН ШАГ\",\"subtitle\":\"Оставьте заявку на консультацию\",\"includeSurname\":\"$undefined\"}]}]}]}]}]]}]\n"])</script>

RouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$e\",\"errorStyles\":[],\"loading\":\"$undefined\",\"loadingStyles\":\"$undefined\",\"hasLoading\":false,\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\",\"childProp\":{\"current\":[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"pif\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"loading\":\"$undefined\",\"loadingStyles\":\"$undefined\",\"hasLoading\":false,\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\",\"childProp\":{\"current\":[\"$L10\",null],\"segment\":\"__PAGE__\"},\"styles\":[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/3dcad5545cbe571d.css\",\"precedence\":\"next\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fef622d5a35f19bf.css\",\"precedence\":\"next\"}]]}],\"segment\":\"pif\"},\"styles\":[]}]}],[\"$\",\"$L11\",null,{}],[\"$\",\"$L12\",null,{\"footerText\":\"\u003ch3\u003eСтоимость инвестиционных паев может увеличиваться и уменьшаться, результаты инвестирования в прошлом не определяют доходы в будущем, государство не гарантирует доходность инвестиций в паевые инвестиционные фонды. Прежде чем приобрести инвестиционный пай паевого инвестиционного фонда, следует внимательно ознакомиться с правилами доверительного управления фондом.\u003c/h3\u003e\u003ch3\u003eРасчет доходности за периоды, определённые согласно пунктам 20.1-20.3 Указания Банка России No5609-У от 02.11.2020:\u003c/h3\u003e\u003ch3\u003eОПИФ «Мой сейф»:\\n          1 мес. 1,21%;\\n          3 мес. 3,11%;\\n          6 мес.5,88%;\\n          1 год 13,78%;\\n          3 года 48,71%;\\n          5 лет 71,50%.\\n          Доходность рассчитана на 31.10.2026.\\n          \u003cbr/\u003e\u003cbr/\u003eОПИФ «Моя пенсия»:\\n          1 мес. 7,47%;\\n          3 мес. 5,28%;\\n          6 мес.-3,72%;\\n          1 год 0,52%;\\n          3 года 20,97%;\\n          5 лет 41,84%.\\n          Доходность рассчитана на 31.10.2026.\\n          \u003cbr/\u003e\u003cbr/\u003eОПИФ «Мои акции»:\\n          1 мес. 9,78%;\\n          3 мес. 9,39%;\\n          6 мес.-5,47%;\\n          1 год 0,27%;\\n          3 года -5,89%;\\n          5 лет -9,78%.\\n          Доходность рассчитана на 31.10.2026.\\n          \u003cbr/\u003e\u003cbr/\u003eБПИФ «Ингосстрах - Корпоративные облигации»:\\n          1 мес. 1,19%;\\n          3 мес. 3,39%;\\n          6 мес.6,37%;\\n          1 год 16,21%;\\n          3 года 51,10%;\\n          5 лет 70,63%.\\n          Доходность рассчитана на 31.10.2026.\\n          \u003cbr/\u003e\u003cbr/\u003eБПИФ «Ингосстрах Инфляционный»:\\n          1 мес. 1,37%;\\n          3 мес. 6,02%;\\n          6 мес.9,29%;\\n          1 год 21,71%;\\n          3 года 28,92%;\\n          5 лет -.\\n          Доходность рассчитана на 31.10.2026.\\n          \u003cbr/\u003e\u003cbr/\u003eБПИФ «Облигации в юанях»:\\n          1 мес. -0,90%;\\n          3 мес. 3,59%;\\n          6 мес.10,43%;\\n          1 год 11,41%;\\n          3 года 12,01%;\\n          5 лет -.\\n          Доходность рассчитана на 31.10.2026.\\n          \u003c/h3\u003e\u003ch3\u003eДинамическая доходность рассчитывается на каждый день и в соответствии с пунктом 20.5 Указания Банка России No5609-У от 02.11.2020, при этом:\u003c/h3\u003e\u003ch3\u003e- окончанием периода для расчета является указанная отчетная дата;\u003c/h3\u003e\u003ch3\u003e- началом периода для расчета является дата, образуемая вычитанием программными средствами из указанной отчетной даты периода для расчета, измеряемого соответственно в целых месяцах или годах.\u003c/h3\u003e\u003ch3\u003eПо всем ОПИФ предусмотрены надбавки к расчетной стоимости инвестиционных паев при их выдаче, взимание которых уменьшает доходность инвестиций в инвестиционные паи.\u003c/h3\u003e\u003ch3\u003e«Индекс МосБиржи Корпоративных Облигаций RUCBTR2A3A3Y»; Индекс МосБиржи государственных облигаций (RUGBINFTR); Индекс МосБиржи Облигаций, номинированных в китайских юанях RUCNYTR – являются финансовыми индикаторами, рассчитываемыми ПАО Московская Биржа. Правообладателем товарного знака «Индекс МосБиржи» является ПАО Московская Биржа. ПАО Московская Биржа не дает никаких гарантий и заверений третьим лицам в целесообразности инвестирования в финансовые продукты АО УК «Ингосстрах – Инвестиции», основанные на индексах, рассчитываемых ПАО Московская Биржа. Указанные индексы, которые напрямую ассоциируются с товарным знаком «Индекс МосБиржи», созданы и рассчитываются без привязки к хозяйственной деятельности АО УК «Ингосстрах – Инвестиции».\u003c/h3\u003e\u003ch3\u003eЛицо, оказывающее услуги по доверительному управлению и осуществляющее управление паевыми инвестиционными фондами: АО УК «Ингосстрах – Инвестиции». Лицензия ФКЦБ России №21-000-1-00020 от 25.08.1997 на осуществление деятельности по управлению инвестиционными фондами, паевыми инвестиционными фондами и негосударственными пенсионными фондами (без ограничения срока действия). Лицензия профессионального участника рынка ценных бумаг на осуществление деятельности по управлению ценными бумагами №077-08203-001000 от 23.12.2004 выдана ФСФР России (без ограничения срока действия). Результаты инвестирования в прошлом не определяют и не являются гарантией доходности инвестирования в будущем. Стоимость активов может как увеличиваться, так и уменьшаться. До заключения договора необходимо внимательно ознакомиться с его условиями, в том числе с декларацией о рисках. Раскрытая информация не является индивидуальной инвестиционной рекомендацией. Получить сведения о лице, осуществляющем управление активами, и иную информацию, которая должна быть предоставлена в соответствии с законодательством Российской Федерации, можно по адресу: 115035, г. Москва, ул. Пятницкая, д. 12, стр. 2, по телефону: (495) 720-48-98, а также на официальном сайте АО УК «Ингосстрах – Инвестиции» в сети Интернет по адресу: \u003ca target=\\\"_blank\\\" rel=\\\"\\\" href=\\\"https://www.ingosinvest-am.ru\\\"\u003ewww.ingosinvest-am.ru\u003c/a\u003e. Дополнительно о паевых инвестиционных фондах информацию можно получить по адресам агентов (в местах приема заявок на приобретение, погашение и обмен инвестиционных паев).\u003c/h3\u003e\u003ch3\u003eОПИФ рыночных финансовых инструментов «Моя пенсия» (Правила фонда зарегистрированы ФКЦБ России 15.11.2000 за №0050-54904637), ОПИФ рыночных финансовых инструментов «Мои акции» (Правила фонда зарегистрированы ФСФР России 27.12.2007 за №1149-94139555), ОПИФ рыночных финансовых инструментов «Мой сейф» (Правила фонда зарегистрированы ФСФР России 27.12.2007 за №1148-94139715), ОПИФ рыночных финансовых инструментов «Ингосстрах-валютные облигации» (Правила фонда зарегистрированы ФСФР России 25.07.2013 за №2622), БПИФ рыночных финансовых инструментов «Ингосстрах – корпоративные облигации» (Правила фонда зарегистрированы Банком России 28.06.2021 за №4483), БПИФ рыночных финансовых инструментов «Ингосстрах Инфляционный» (Правила фонда зарегистрированы Банком России 02.12.2021, номер: 4742), БПИФ рыночных финансовых инструментов «Облигации в юанях» (Правила фонда зарегистрированы Банком России 19.01.2023 номер: 5248), ЗПИФ рыночных финансовых инструментов «Ингосстрах – Международные рынки» (Правила фонда зарегистрированы Банком России 05.02.2015 за №2937), ЗПИФ рыночных финансовых инструментов «Ингосстрах – передовые технологии» (Правила фонда зарегистрированы Банком России 30.05.2016 за №3160), ЗПИФ рыночных финансовых инструментов «Ингосстрах – драгоценные металлы» (Правила фонда зарегистрированы Банком России 30.05.2016 за №3161), ЗПИФ рыночных финансовых инструментов «Ингосстрах – облигации ЕМ» (Правила фонда зарегистрированы Банком России 05.07.2021 за №4490).\u003c/h3\u003e\u003cp\u003eПередача активов в доверительное управление (в том числе по договору с открытием и ведением индивидуального инвестиционного счета) и инвестирование в паевые инвестиционные фонды не являются услугами по открытию банковских счетов и размещением денежных средств в банковский вклад (депозит), а на переданные (инвестированные) средства не распространяются нормы и гарантии, предусмотренные Федеральным законом от 23.12.2003 №177-ФЗ «О страховании вкладов в банках Российской Федерации» (переданные в доверительное управления денежные средства не подлежат страхованию).\u003c/p\u003e\u003cp\u003eАО УК «Ингосстрах – Инвестиции» информирует о совмещении различных видов деятельности, а также о существовании риска возникновения конфликта интересов. Раскрываемая на сайте информация находится в постоянном доступе.\u003c/p\u003e\u003ch3\u003eАО УК «Ингосстрах-Инвестиции» не является участником системы возмещения стоимости имущества, которое учтено на индивидуальных инвестиционных счетах (далее - ИИС). Инвесторы (клиенты), которым открыты ИИС, не могут рассчитывать на возмещение стоимости имущества, учитываемого на ИИС, за счет Общественно полезного фонда \\\"Фонд гарантирования индивидуальных инвестиционных счетов\\\" в случае несостоятельности (банкротства) АО УК «Ингосстрах-Инвестиции».\u003c/h3\u003e\u003cp\u003eПубликация информации на сайте осуществляется по московскому времени.\u003c/p\u003e\",\"footerCategories\":[{\"title\":\"Продукты\",\"links\":[{\"title\":\"Доверительное управление\",\"link\":\"/trust-management\"},{\"title\":\"Открытые паевые фонды\",\"link\":\"/pif\"},{\"title\":\"Биржевые паевые фонды\",\"link\":\"/bpif\"}]},{\"title\":\"Юридическим лицам\",\"links\":[{\"title\":\"Корпоративным клиентам\",\"link\":\"/corporate-clients\"},{\"title\":\"Страховым компаниям\",\"link\":\"/insurance-companies\"},{\"title\":\"Негосударственным пенсионным фондам\",\"link\":\"/pension-funds\"},{\"title\":\"Фондам целевого капитала\",\"link\":\"/endowment-funds\"},{\"title\":\"Саморегулируемым организациям\",\"link\":\"/self-regulatory-organizations\"}]}],\"footerLinks\":
