# Обновление по расписанию: докачать новые точки, проверить качество и опубликовать.
# Публикация (коммит данных → автодеплой Vercel) только если в отчёте нет ошибок сбора и разбора.
name: Update data
on:
  schedule:
    - cron: '0 18 * * *'   # 21:00 МСК: к вечеру УК уже опубликовали СЧА за прошлый рабочий день
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: update-data, cancel-in-progress: false }

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pyproject.toml }
      - run: pip install -e '.[dev]'
      - name: Сырые ответы прошлых прогонов (в git их нет)
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Тесты
        run: python -m pytest -q
      - name: Сбор и сборка данных
        run: python -m pif all --strict
      - name: Отчёт качества и лог
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ github.run_id }}
          path: |
            data/quality_report.md
            logs/
      - name: Сырые ответы при ошибке — для разбора причины
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw/
          retention-days: 3
      - name: Публикация (коммит данных)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Данные не изменились"; exit 0; fi
          git commit -m "Данные: обновление $(date -u +%F)"
          git push
