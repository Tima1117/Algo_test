[project]
name = "pif-registry"
version = "0.1.0"
description = "Реестр розничных ПИФов России: сбор из первичных источников, нормализация, притоки"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",          # BSD-3-Clause
  "openpyxl>=3.1",        # MIT
  "beautifulsoup4>=4.12", # MIT
  "lxml>=5",              # BSD-3-Clause
  "pypdf>=4",             # BSD-3-Clause — доходность из КИД (PDF)
]

[project.optional-dependencies]
dev = ["pytest>=8"]       # MIT

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pif*"]
