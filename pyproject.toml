[project]
name = "pif-registry"
version = "0.1.0"
description = "Реестр розничных ПИФов России: сбор из первичных источников, нормализация, притоки"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",          # BSD-3-Clause
  "openpyxl>=3.1",        # MIT
  "beautifulsoup4>=4.12", # MIT
  "lxml>=5",              # BSD-3-Clause
]

[project.optional-dependencies]
dev = ["pytest>=8"]       # MIT

[tool.pytest.ini_options]
testpaths = ["tests"]
